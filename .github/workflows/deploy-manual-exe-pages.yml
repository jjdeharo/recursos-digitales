name: Deploy manual eXeLearning to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "manual-exe/manual-of-exelearning-301_web/**"
      - ".github/workflows/deploy-manual-exe-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare artifact with nested path
        run: |
          mkdir -p _site/manual-exe
          cp -a manual-exe/manual-of-exelearning-301_web _site/manual-exe/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
